<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #14233a; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #52647b; }
      .tag { font-size: 18px; font-weight: 800; fill: #0f766e; }
      .heading { font-size: 27px; font-weight: 800; }
      .body { font-size: 20px; font-weight: 500; fill: #34455d; }
      .body-bold { font-size: 20px; font-weight: 800; fill: #17263d; }
      .small { font-size: 16px; font-weight: 500; fill: #617188; }
      .num { font-size: 22px; font-weight: 900; fill: #ffffff; }
      .term { font-size: 19px; font-weight: 800; fill: #1e4970; }
      .plain { font-size: 18px; font-weight: 600; fill: #34455d; }
      .quote { font-size: 24px; font-weight: 700; fill: #17263d; }
      .warning { font-size: 18px; font-weight: 800; fill: #8a3b12; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#f6f9fc"/>
  <rect x="0" y="0" width="18" height="1080" fill="#2563eb"/>

  <text x="74" y="70" class="tag">ASTRA · 비개발자용 쉬운 설명 · 2/2</text>
  <text x="74" y="128" class="title">한 문장을 예로 보면 구간 라벨링이 쉽다</text>
  <text x="74" y="168" class="subtitle">핵심은 “답변 전체가 틀렸다”가 아니라, 근거와 맞지 않는 바로 그 표현만 찾아 표시하는 것이다.</text>

  <!-- example -->
  <g filter="url(#shadow)">
    <rect x="74" y="205" width="1772" height="228" rx="22" fill="#ffffff" stroke="#d8e2ee"/>
  </g>
  <rect x="100" y="234" width="120" height="42" rx="12" fill="#e8f0ff"/>
  <text x="160" y="263" text-anchor="middle" class="term">실제 근거</text>
  <text x="248" y="264" class="quote">“공동수급은 허용하지 않습니다.”</text>

  <rect x="100" y="301" width="120" height="42" rx="12" fill="#e8f8f5"/>
  <text x="160" y="330" text-anchor="middle" class="term">생성 답변</text>
  <text x="248" y="330" class="quote">“이 공고는 공동수급으로</text>
  <rect x="529" y="299" width="224" height="43" rx="8" fill="#ffe0dc"/>
  <text x="541" y="330" class="quote" fill="#b63b32">참여할 수 있습니다.</text>
  <text x="760" y="330" class="quote">”</text>

  <line x1="865" y1="254" x2="865" y2="352" stroke="#c6d1df" stroke-width="2"/>
  <text x="905" y="258" class="heading">판정</text>
  <rect x="905" y="281" width="232" height="42" rx="12" fill="#e4584b"/>
  <text x="1021" y="310" text-anchor="middle" class="num">근거와 모순</text>
  <text x="905" y="353" class="body">답변 전체가 아니라</text>
  <text x="905" y="385" class="body-bold">“참여할 수 있습니다”만 표시</text>

  <rect x="1280" y="236" width="520" height="160" rx="16" fill="#f2f6fb" stroke="#d8e2ee"/>
  <text x="1310" y="272" class="heading">왜 이렇게 표시하나?</text>
  <text x="1310" y="310" class="body">앞부분의 “공동수급”은 주제 자체로 맞다.</text>
  <text x="1310" y="344" class="body">틀린 부분은 허용 여부를 반대로 말한 표현이다.</text>
  <text x="1310" y="378" class="small">맞는 내용까지 빨갛게 칠하면 탐지기가 잘못 배운다.</text>

  <!-- five steps -->
  <text x="74" y="482" class="heading">사람은 다섯 단계로 판단한다</text>
  <g filter="url(#shadow)">
    <rect x="74" y="510" width="330" height="215" rx="18" fill="#ffffff" stroke="#d8e2ee"/>
    <rect x="428" y="510" width="330" height="215" rx="18" fill="#ffffff" stroke="#d8e2ee"/>
    <rect x="782" y="510" width="330" height="215" rx="18" fill="#ffffff" stroke="#d8e2ee"/>
    <rect x="1136" y="510" width="330" height="215" rx="18" fill="#ffffff" stroke="#d8e2ee"/>
    <rect x="1490" y="510" width="356" height="215" rx="18" fill="#ffffff" stroke="#d8e2ee"/>
  </g>

  <circle cx="111" cy="550" r="23" fill="#2563eb"/><text x="111" y="558" text-anchor="middle" class="num">1</text>
  <text x="148" y="558" class="heading">질문 확인</text>
  <text x="101" y="600" class="body">사용자가 무엇을</text>
  <text x="101" y="631" class="body">물었는지 먼저 읽는다.</text>
  <text x="101" y="684" class="small">질문 밖의 내용을 억지로</text>
  <text x="101" y="707" class="small">정답으로 만들지 않는다.</text>

  <circle cx="465" cy="550" r="23" fill="#0f9f8f"/><text x="465" y="558" text-anchor="middle" class="num">2</text>
  <text x="502" y="558" class="heading">근거 읽기</text>
  <text x="455" y="600" class="body">모델이 답변할 때 실제로</text>
  <text x="455" y="631" class="body">받은 문서만 우선 본다.</text>
  <text x="455" y="684" class="small">나중에 찾은 자료는 별도</text>
  <text x="455" y="707" class="small">참고자료로 기록한다.</text>

  <circle cx="819" cy="550" r="23" fill="#5b5bd6"/><text x="819" y="558" text-anchor="middle" class="num">3</text>
  <text x="856" y="558" class="heading">주장 대조</text>
  <text x="809" y="600" class="body">누가·언제·얼마·가능한지</text>
  <text x="809" y="631" class="body">조건과 예외까지 비교한다.</text>
  <text x="809" y="684" class="small">단어가 달라도 의미가 같으면</text>
  <text x="809" y="707" class="small">정상적인 바꿔 말하기다.</text>

  <circle cx="1173" cy="550" r="23" fill="#f59e0b"/><text x="1173" y="558" text-anchor="middle" class="num">4</text>
  <text x="1210" y="558" class="heading">틀린 부분 표시</text>
  <text x="1163" y="600" class="body">근거와 모순되거나</text>
  <text x="1163" y="631" class="body">근거가 없는 최소 표현만.</text>
  <text x="1163" y="684" class="small">인용번호 오류와 답변 누락은</text>
  <text x="1163" y="707" class="small">다른 종류로 분리한다.</text>

  <circle cx="1527" cy="550" r="23" fill="#e4584b"/><text x="1527" y="558" text-anchor="middle" class="num">5</text>
  <text x="1564" y="558" class="heading">애매하면 보류</text>
  <text x="1517" y="600" class="body">판단하기 어려운 문장은</text>
  <text x="1517" y="631" class="body">정상으로 넘기지 않는다.</text>
  <text x="1517" y="684" class="small">다른 검수자가 다시 보고</text>
  <text x="1517" y="707" class="small">합의한 뒤 학습에 쓴다.</text>

  <!-- glossary and use -->
  <g filter="url(#shadow)">
    <rect x="74" y="754" width="850" height="226" rx="18" fill="#ffffff" stroke="#d8e2ee"/>
    <rect x="950" y="754" width="896" height="226" rx="18" fill="#ffffff" stroke="#d8e2ee"/>
  </g>
  <text x="104" y="800" class="heading">어려운 용어를 이렇게 이해하면 된다</text>
  <text x="104" y="842" class="term">구간(span)</text><text x="245" y="842" class="plain">문장에서 형광펜으로 칠한 특정 표현</text>
  <text x="104" y="878" class="term">위치값 [start,end)</text><text x="310" y="878" class="plain">형광펜이 시작하고 끝나는 글자 위치</text>
  <text x="104" y="914" class="term">해시(hash)</text><text x="245" y="914" class="plain">답변과 근거가 중간에 바뀌지 않았는지 확인하는 지문</text>
  <text x="104" y="950" class="term">JSONL / BIO</text><text x="245" y="950" class="plain">검수 결과를 컴퓨터가 학습·채점할 수 있게 저장하는 형식</text>

  <text x="980" y="800" class="heading">이 라벨은 어디에 쓰나?</text>
  <rect x="980" y="827" width="252" height="108" rx="14" fill="#eaf1ff"/>
  <text x="1106" y="862" text-anchor="middle" class="body-bold">모델 학습</text>
  <text x="1106" y="895" text-anchor="middle" class="small">어떤 표현을 의심해야</text>
  <text x="1106" y="918" text-anchor="middle" class="small">하는지 예시로 제공</text>
  <rect x="1251" y="827" width="252" height="108" rx="14" fill="#e8f8f5"/>
  <text x="1377" y="862" text-anchor="middle" class="body-bold">성능 평가</text>
  <text x="1377" y="895" text-anchor="middle" class="small">정상 오탐과 실제 환각</text>
  <text x="1377" y="918" text-anchor="middle" class="small">누락을 함께 계산</text>
  <rect x="1522" y="827" width="294" height="108" rx="14" fill="#fff2df"/>
  <text x="1669" y="862" text-anchor="middle" class="body-bold">서비스 화면</text>
  <text x="1669" y="895" text-anchor="middle" class="small">의심 표현을 강조하고</text>
  <text x="1669" y="918" text-anchor="middle" class="small">근거 원문으로 바로 이동</text>

  <rect x="74" y="1001" width="1772" height="50" rx="12" fill="#fff2df" stroke="#f2b866"/>
  <text x="102" y="1033" class="warning">중요: AI가 만든 초안 → 사람 검수 → 최종 승인 순서다. 애매하거나 미검수인 문장은 정상 정답으로 계산하지 않는다.</text>
</svg>
