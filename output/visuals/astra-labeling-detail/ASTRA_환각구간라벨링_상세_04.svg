<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 4/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">3단계 · 각 주장에 같은 판정 순서를 적용한다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">한 문장에 정상 표현과 오류 표현이 섞일 수 있으므로 주장 단위로 분해한 뒤 아래 순서로 판단한다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><g><rect x="74" y="238" width="320" height="225" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="238" width="8" height="225" rx="4" fill="#0f9f8f"/><text x="102" y="280" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">① 근거가 직접 지지?</text><text x="102" y="318" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">예 → 정상(O)</text><text x="102" y="356" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">바꿔 말해도 의미가 같으면 정상</text></g><g><rect x="430" y="238" width="320" height="225" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="430" y="238" width="8" height="225" rx="4" fill="#e4584b"/><text x="458" y="280" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">② 근거와 명시적 모순?</text><text x="458" y="318" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">예 → CONTRADICTION</text><text x="458" y="356" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">허용↔금지, 있음↔없음, 주체 변경</text></g><g><rect x="786" y="238" width="320" height="225" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="786" y="238" width="8" height="225" rx="4" fill="#f59e0b"/><text x="814" y="280" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">③ 지지 근거가 없음?</text><text x="814" y="318" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">예 → UNSUPPORTED</text><text x="814" y="356" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거 밖 수치·조건·단정</text></g><g><rect x="1142" y="238" width="320" height="225" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1142" y="238" width="8" height="225" rx="4" fill="#2563eb"/><text x="1170" y="280" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">④ 인용 연결만 틀림?</text><text x="1170" y="318" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">예 → CITATION_ERROR</text><text x="1170" y="356" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">없는 [3], 잘못된 페이지·출처</text></g><g><rect x="1498" y="238" width="348" height="225" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1498" y="238" width="8" height="225" rx="4" fill="#5b5bd6"/><text x="1526" y="280" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">⑤ 의미·범위가 모호?</text><text x="1526" y="318" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">예 → UNCERTAIN/HOLD</text><text x="1526" y="356" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정상으로 세지 않고 재검토</text></g><text x="74" y="525" font-size="28" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">환각과 분리하는 품질 문제</text><rect x="74" y="565" width="328" height="205" rx="16" fill="#ffffff" stroke="#d8e2ee"/><text x="96" y="607" font-size="22" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">누락</text><text x="96" y="648" font-size="17" font-weight="700" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">필요한 답을 쓰지 않음</text><text x="96" y="696" font-size="15" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">존재하지 않는 구절을 환각 span으로 만들지 않음</text><rect x="428" y="565" width="328" height="205" rx="16" fill="#e8f8f5" stroke="#d8e2ee"/><text x="450" y="607" font-size="22" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">잘림</text><text x="450" y="648" font-size="17" font-weight="700" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">출력 길이 때문에 문장이 끝나지 않음</text><text x="450" y="696" font-size="15" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">finish_reason·토큰 한도 문제로 별도 기록</text><rect x="782" y="565" width="328" height="205" rx="16" fill="#ffffff" stroke="#d8e2ee"/><text x="804" y="607" font-size="22" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">반복</text><text x="804" y="648" font-size="17" font-weight="700" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">같은 내용을 여러 번 출력</text><text x="804" y="696" font-size="15" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">반복 자체는 품질; 거짓이면 각 위치를 라벨</text><rect x="1136" y="565" width="328" height="205" rx="16" fill="#e8f8f5" stroke="#d8e2ee"/><text x="1158" y="607" font-size="22" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">검색 누락</text><text x="1158" y="648" font-size="17" font-weight="700" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">중요 근거가 모델 입력에 없음</text><text x="1158" y="696" font-size="15" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">생성 오류와 검색 오류를 분리</text><rect x="1490" y="565" width="328" height="205" rx="16" fill="#ffffff" stroke="#d8e2ee"/><text x="1512" y="607" font-size="22" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">권한 차단</text><text x="1512" y="648" font-size="17" font-weight="700" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정책상 문서를 볼 수 없음</text><text x="1512" y="696" font-size="15" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정상 보안 결과로 별도 평가</text><g><rect x="74" y="805" width="1772" height="165" rx="18" fill="#fff2df" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="805" width="8" height="165" rx="4" fill="#f59e0b"/><text x="102" y="847" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">중요한 예외</text><text x="102" y="885" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">일반 상식·상투적 유보 문구를 무조건 환각으로 칠하지 않는다. 반대로 수치 계산이 맞아도 그 수치를 적용한 대상·기간·VAT·마진 의미가 틀리면 해당 역할 표현을 표시한다.</text><text x="102" y="927" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">한 주장에 라벨이 겹치거나 원문끼리 충돌하면 억지로 하나로 합치지 않고 조정 대상으로 남긴다.</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">판정 코드: CONTRADICTION · UNSUPPORTED · CITATION_ERROR · UNCERTAIN / 품질 메모 별도</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>