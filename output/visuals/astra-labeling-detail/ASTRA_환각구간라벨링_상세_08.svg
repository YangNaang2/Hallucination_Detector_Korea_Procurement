<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 8/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">7단계 · 승인 구간을 KLUE 학습·평가·서비스로 연결한다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">모델 단독 결과, 규칙 결합 결과와 답변/문자/구간 단위 지표를 서로 분리해 본다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><g><rect x="74" y="230" width="420" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="230" width="8" height="260" rx="4" fill="#2563eb"/><text x="102" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">① 문자 → 토큰</text><text x="102" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">승인 span을 토큰 위치로 변환</text><text x="102" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">환각 토큰=1, 정상 토큰=0</text><text x="102" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">보류·미검수 토큰은 mask</text><text x="102" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">질문·근거·답변 형식 고정</text></g><line x1="506" y1="360" x2="550" y2="360" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="562" y="230" width="420" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="562" y="230" width="8" height="260" rx="4" fill="#0f9f8f"/><text x="590" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">② 근거 window</text><text x="590" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">긴 근거를 여러 window로 분할</text><text x="590" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">같은 답변 토큰을 각 window와 비교</text><text x="590" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">한 근거가 지지하면 정상 가능</text><text x="590" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">window 집계 방식은 개발 자료에서 선택</text></g><line x1="994" y1="360" x2="1038" y2="360" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="1050" y="230" width="370" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1050" y="230" width="8" height="260" rx="4" fill="#f59e0b"/><text x="1078" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">③ 점수·임계값</text><text x="1078" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">토큰별 의심 확률</text><text x="1078" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">문장/절/연속 구절 통합 후보</text><text x="1078" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정상 오탐과 환각 누락 trade-off</text><text x="1078" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">임계값은 개발 자료로만 선택</text></g><line x1="1432" y1="360" x2="1476" y2="360" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="1488" y="230" width="358" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1488" y="230" width="8" height="260" rx="4" fill="#e4584b"/><text x="1516" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">④ 출력</text><text x="1516" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">의심 구절과 점수</text><text x="1516" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변 전체 경고 여부</text><text x="1516" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">보류/검수 우선순위</text><text x="1516" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거·설정·모델 hash</text></g><text x="74" y="550" font-size="28" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">서로 다른 평가 단위</text><g><rect x="74" y="585" width="540" height="210" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="585" width="8" height="210" rx="4" fill="#2563eb"/><text x="102" y="627" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변 단위</text><text x="102" y="665" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">TP/FP/FN/TN</text><text x="102" y="702" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정밀도·재현율·F1·정확도</text><text x="102" y="739" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“어떤 답변에 오류가 있는가”</text></g><g><rect x="640" y="585" width="540" height="210" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="640" y="585" width="8" height="210" rx="4" fill="#0f9f8f"/><text x="668" y="627" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">문자 단위</text><text x="668" y="665" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">문자 위치별 P/R/F1</text><text x="668" y="702" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">경고 범위가 넓으면 FP 증가</text><text x="668" y="739" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“틀린 문자를 얼마나 맞혔는가”</text></g><g><rect x="1206" y="585" width="640" height="210" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1206" y="585" width="8" height="210" rx="4" fill="#5b5bd6"/><text x="1234" y="627" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">Exact-span 단위</text><text x="1234" y="665" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">시작·끝 경계가 모두 같아야 정답</text><text x="1234" y="702" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변 포착률이 높아도 0일 수 있음</text><text x="1234" y="739" font-size="19" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">서비스의 정확한 형광펜 품질을 반영</text></g><g><rect x="74" y="830" width="1772" height="140" rx="18" fill="#eef4fa" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="830" width="8" height="140" rx="4" fill="#1e4970"/><text x="102" y="872" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">서비스에서는</text><text x="102" y="910" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">의심 구절을 강조하고 관련 근거로 이동시키되, 모델 경고를 최종 판정으로 표시하지 않는다. 정상/환각/보류 상태와 근거를 함께 보여 사람이 확인하게 한다.</text><text x="102" y="948" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">금액·날짜·자격·의무 조건 규칙을 결합하면 KLUE 단독 성능과 결합 성능을 별도로 보고한다.</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">KLUE 주력 · XLM-R/BGE-M3는 비교 보존 · 독립 개선 가설이 있을 때만 제한적으로 재실행</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>