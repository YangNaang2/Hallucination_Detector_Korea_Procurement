<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 5/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">4단계 · 틀린 의미를 유지하는 최소 구간만 표시한다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정확한 구간은 학습 정답이자 화면의 형광펜 위치이므로 원시 답변 문자열과 완전히 일치해야 한다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><g><rect x="74" y="230" width="850" height="250" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="230" width="8" height="250" rx="4" fill="#2563eb"/><text x="102" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">구간 경계 원칙</text><text x="102" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 0부터 시작하는 Unicode code point 위치</text><text x="102" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• [start,end): start 포함, end 직전까지</text><text x="102" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• Markdown·공백·줄바꿈(LF)·오타를 그대로 보존</text><text x="102" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• Excel 행 번호·UTF-8 byte·JS UTF-16 index와 다름</text><text x="102" y="434" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 같은 오류가 반복되면 실제 출현 위치마다 기록</text></g><g><rect x="950" y="230" width="896" height="250" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="950" y="230" width="8" height="250" rx="4" fill="#0f9f8f"/><text x="978" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">최소 구간 선택 원칙</text><text x="978" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 맞는 주변 문장을 통째로 칠하지 않음</text><text x="978" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 첫 결론이 틀리고 뒤 설명이 맞으면 첫 결론만</text><text x="978" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 숫자는 맞고 적용 의미가 틀리면 의미가 드러나는 구절</text><text x="978" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 다른 오류가 겹치면 별도 span 또는 조정 대상</text><text x="978" y="434" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 답변에 없는 “누락 내용”을 가상 span으로 만들지 않음</text></g><text x="74" y="545" font-size="28" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">구체적인 예</text><rect x="74" y="578" width="1772" height="230" rx="20" fill="#fff" stroke="#d8e2ee" filter="url(#shadow)"/><text x="105" y="625" font-size="18" font-weight="800" fill="#1e4970" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변 원문</text><text x="240" y="625" font-size="25" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“이 공고는 공동수급으로</text><rect x="581" y="592" width="250" height="44" rx="8" fill="#ffe9e6"/><text x="595" y="625" font-size="25" font-weight="800" fill="#b63b32" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">참여할 수 있습니다.</text><text x="838" y="625" font-size="25" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">”</text><text x="105" y="681" font-size="18" font-weight="800" fill="#1e4970" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">저장 구간</text><text x="240" y="681" font-size="21" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">start=14 · end=25 · quote="참여할 수 있습니다."</text><text x="105" y="736" font-size="18" font-weight="800" fill="#1e4970" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">저장 이유</text><text x="240" y="736" font-size="20" font-weight="600" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“공동수급”이라는 주제는 맞고, 허용 여부를 반대로 말한 서술만 모순이기 때문</text><g><rect x="74" y="840" width="545" height="130" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="840" width="8" height="130" rx="4" fill="#e4584b"/><text x="102" y="882" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">문자열 검증</text><text x="102" y="920" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">actual_answer[start:end] == quote</text><text x="102" y="951" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">하나라도 다르면 저장 실패</text></g><g><rect x="646" y="840" width="570" height="130" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="646" y="840" width="8" height="130" rx="4" fill="#5b5bd6"/><text x="674" y="882" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">토큰 변환 검증</text><text x="674" y="920" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">문자 span ↔ tokenizer offset 정합</text><text x="674" y="951" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">window 잘림·마스크 확인</text></g><g><rect x="1243" y="840" width="603" height="130" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1243" y="840" width="8" height="130" rx="4" fill="#f59e0b"/><text x="1271" y="882" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">화면 검증</text><text x="1271" y="920" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">저장 좌표와 UI 형광펜이 동일</text><text x="1271" y="951" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">원문 근거 위치로 이동 가능</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정확한 구간 경계가 없으면 문자 F1, exact-span F1, 모델 학습과 UI 강조가 모두 흔들린다.</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>