<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 3/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">2단계 · “당시 모델이 본 근거”를 복원한다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정답 문서 전체가 아니라 생성 시점에 실제 전달된 citation·chunk·범위를 기준으로 지지 여부를 판단한다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><g><rect x="74" y="230" width="520" height="315" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="230" width="8" height="315" rx="4" fill="#5b5bd6"/><text x="102" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">Prompt context에서 복원</text><text x="102" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">[1] … [자료 1 끝] 블록 식별</text><text x="102" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">citation 번호와 evidence 순서 확인</text><text x="102" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">chunk_id·text_sha256 대조</text><text x="102" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">context_start/end 위치 계산</text><text x="102" y="434" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">source_start/end 원문 위치 연결</text></g><line x1="606" y1="387" x2="664" y2="387" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="676" y="230" width="520" height="315" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="676" y="230" width="8" height="315" rx="4" fill="#f59e0b"/><text x="704" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변 주장과 연결</text><text x="704" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">질문이 요구한 대상·시점 확인</text><text x="704" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">주체·숫자·날짜·금액 추출</text><text x="704" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">자격·의무·가능·예외 범위 확인</text><text x="704" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">직접 지지·명시 모순·근거 부재</text><text x="704" y="434" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">판단 이유와 evidence_ids 기록</text></g><line x1="1208" y1="387" x2="1266" y2="387" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="1278" y="230" width="568" height="315" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1278" y="230" width="8" height="315" rx="4" fill=