x="12" fill="#0f9f8f"/><text x="591.5" y="698" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거</text><text x="539" y="754" font-size="21" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">모델이 무엇을 보았는가?</text><text x="539" y="795" font-size="17" font-weight="600" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">citation·chunk·기준일</text><rect x="960" y="645" width="417" height="205" rx="18" fill="#fff2df" stroke="#d8e2ee"/><rect x="982" y="669" width="105" height="42" rx="12" fill="#f59e0b"/><text x="1034.5" y="698" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변</text><text x="982" y="754" font-size="21" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">어떤 주장을 했는가?</text><text x="982" y="795" font-size="17" font-weight="600" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">주체·조건·수치·결론</text><rect x="1403" y="645" width="417" height="205" rx="18" fill="#efedff" stroke="#d8e2ee"/><rect x="1425" y="669" width="105" height="42" rx="12" fill="#5b5bd6"/><text x="1477.5" y="698" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">시나리오</text><text x="1425" y="754" font-size="21" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">그 시점에 유효한가?</text><text x="1425" y="795" font-size="17" font-weight="600" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">회사·공고·역할·날짜</text><rect x="74" y="879" width="1772" height="90" rx="18" fill="#eef4fa" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="879" width="8" height="90" rx="4" fill="#1e4970"/><text x="103" y="915" font-size="18" font-weight="800" fill="#1e4970" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">판정 기준의 중심</text><text x="103" y="950" font-size="22" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“현실에서 참인가?”보다 “생성 입력 근거가 이 주장을 지지하는가?”를 먼저 판정한다.</text><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거 anchor에는 citation, chunk_id, text_sha256, quote, context/source start·end를 함께 기록</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>