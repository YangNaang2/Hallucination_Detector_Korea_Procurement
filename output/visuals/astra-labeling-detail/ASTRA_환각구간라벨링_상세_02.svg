<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 2/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">1단계 · 평가 대상을 먼저 얼린다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">질문 300건 중 생성 답변 295건과 정상 접근 차단 5건을 다른 평가 대상으로 관리한다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><g><rect x="74" y="230" width="540" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="230" width="8" height="260" rx="4" fill="#2563eb"/><text x="102" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">300개 평가 레코드</text><text x="102" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">질문 ID와 회사·공고·시나리오</text><text x="102" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">질문·기대답·근거 연결</text><text x="102" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">공고 그룹 기준 분할 정보</text><text x="102" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">평가 정답은 생성 요청에서 제외</text></g><g><rect x="640" y="230" width="540" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="640" y="230" width="8" height="260" rx="4" fill="#0f9f8f"/><text x="668" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">295개 detector 대상</text><text x="668" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">실제 생성 답변 actual_answer</text><text x="668" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">생성 당시 prompt context</text><text x="668" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">실제 선택 evidence 목록</text><text x="668" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">answer/context/evidence hash</text></g><g><rect x="1206" y="230" width="640" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1206" y="230" width="8" height="260" rx="4" fill="#e4584b"/><text x="1234" y="272" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">5개 정상 접근 차단</text><text x="1234" y="310" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">LLM 호출 전에 access_denied</text><text x="1234" y="341" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변 실패나 빈 답변이 아님</text><text x="1234" y="372" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">환각 탐지 학습·추론에서 제외</text><text x="1234" y="403" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">별도 보안 정책 검사로 보존</text></g><text x="74" y="548" font-size="28" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">입력 무결성 검사</text><rect x="74" y="585" width="270" height="130" rx="15" fill="#eaf1ff" stroke="#d8e2ee"/><rect x="92" y="603" width="82" height="42" rx="12" fill="#2563eb"/><text x="133" y="632" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ID</text><text x="92" y="678" font-size="17" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">300개 고유·누락 없음</text><rect x="369" y="585" width="270" height="130" rx="15" fill="#e8f8f5" stroke="#d8e2ee"/><rect x="387" y="603" width="82" height="42" rx="12" fill="#0f9f8f"/><text x="428" y="632" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정본</text><text x="387" y="678" font-size="17" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변 문자열 byte/문자 일치</text><rect x="664" y="585" width="270" height="130" rx="15" fill="#eaf1ff" stroke="#d8e2ee"/><rect x="682" y="603" width="82" height="42" rx="12" fill="#2563eb"/><text x="723" y="632" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거</text><text x="682" y="678" font-size="17" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">chunk ID·citation·hash 연결</text><rect x="959" y="585" width="270" height="130" rx="15" fill="#e8f8f5" stroke="#d8e2ee"/><rect x="977" y="603" width="82" height="42" rx="12" fill="#0f9f8f"/><text x="1018" y="632" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">분리</text><text x="977" y="678" font-size="17" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정답·라벨이 생성 입력에 없음</text><rect x="1254" y="585" width="270" height="130" rx="15" fill="#eaf1ff" stroke="#d8e2ee"/><rect x="1272" y="603" width="82" height="42" rx="12" fill="#2563eb"/><text x="1313" y="632" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">차단</text><text x="1272" y="678" font-size="17" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">5건 detector_target=false</text><rect x="1549" y="585" width="270" height="130" rx="15" fill="#e8f8f5" stroke="#d8e2ee"/><rect x="1567" y="603" width="82" height="42" rx="12" fill="#0f9f8f"/><text x="1608" y="632" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">재개</text><text x="1567" y="678" font-size="17" font-weight="700" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">설정 hash가 같을 때만 skip</text><g><rect x="74" y="758" width="1772" height="210" rx="18" fill="#eef4fa" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="758" width="8" height="210" rx="4" fill="#1e4970"/><text x="102" y="800" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">핵심 불변조건</text><text x="102" y="838" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정본 답변을 다시 생성하거나 맞춤법을 고친 뒤 같은 ID로 덮어쓰지 않는다. 새 답변은 새 run_id로 저장한다.</text><text x="102" y="880" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">다른 설정의 결과를 이어붙이지 않는다. resume은 입력·모델·코드·설정 식별자가 모두 같은 경우에만 허용한다.</text><text x="102" y="922" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">접근 차단을 정상 답변으로 포함하거나, 미검수 답변을 정상으로 간주하지 않는다.</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">실행 시작점: python procurement-pipeline/prepare_detector300_handoff.py --check</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>