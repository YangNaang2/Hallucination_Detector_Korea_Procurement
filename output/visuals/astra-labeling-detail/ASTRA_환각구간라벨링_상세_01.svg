<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 1/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정본 답변에서 서비스 경고까지, 한 줄로 이어진다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">각 단계가 이전 단계의 원본·근거·상태를 보존해야 결과를 다시 검증할 수 있다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><rect x="74" y="245" width="190" height="120" rx="16" fill="#2563eb"/><text x="169" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">① 정본 고정</text><text x="169" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">질문·답변·해시</text><line x1="266" y1="305" x2="285" y2="305" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="293" y="245" width="190" height="120" rx="16" fill="#0f9f8f"/><text x="388" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">② 근거 복원</text><text x="388" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">실제 입력 chunk</text><line x1="485" y1="305" x2="504" y2="305" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="512" y="245" width="190" height="120" rx="16" fill="#5b5bd6"/><text x="607" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">③ 주장 분해</text><text x="607" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">최소 의미 단위</text><line x1="704" y1="305" x2="723" y2="305" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="731" y="245" width="190" height="120" rx="16" fill="#f59e0b"/><text x="826" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">④ 근거 대조</text><text x="826" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">지지·모순·부재</text><line x1="923" y1="305" x2="942" y2="305" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="950" y="245" width="190" height="120" rx="16" fill="#e4584b"/><text x="1045" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">⑤ 구간 표시</text><text x="1045" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">문자 [start,end)</text><line x1="1142" y1="305" x2="1161" y2="305" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1169" y="245" width="190" height="120" rx="16" fill="#1e4970"/><text x="1264" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">⑥ 사람 조정</text><text x="1264" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">보류·승인 분리</text><line x1="1361" y1="305" x2="1380" y2="305" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1388" y="245" width="190" height="120" rx="16" fill="#334155"/><text x="1483" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">⑦ 모델 평가</text><text x="1483" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">KLUE·임계값</text><line x1="1580" y1="305" x2="1599" y2="305" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1607" y="245" width="190" height="120" rx="16" fill="#2563eb"/><text x="1702" y="286" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">⑧ UI 사용</text><text x="1702" y="326" font-size="15" font-weight="600" fill="#eaf2ff" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">강조·근거 이동</text><g><rect x="74" y="414" width="550" height="245" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="414" width="8" height="245" rx="4" fill="#2563eb"/><text x="102" y="456" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">변하지 않아야 하는 것</text><text x="102" y="494" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 실제 생성 답변 문자열과 줄바꿈</text><text x="102" y="525" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 당시 모델에 제공된 근거와 인용 순서</text><text x="102" y="556" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 문서·청크·답변의 SHA-256</text><text x="102" y="587" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• Unicode 문자 위치와 질문 ID</text></g><g><rect x="650" y="414" width="570" height="245" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="650" y="414" width="8" height="245" rx="4" fill="#0f9f8f"/><text x="678" y="456" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">판단하며 추가되는 것</text><text x="678" y="494" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 주장별 오류 유형과 최소 구간</text><text x="678" y="525" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 구절을 지지/반박하는 근거 ID</text><text x="678" y="556" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 판단 이유와 검수자의 처리</text><text x="678" y="587" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 보류·승인·학습 가능 상태</text></g><g><rect x="1246" y="414" width="600" height="245" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1246" y="414" width="8" height="245" rx="4" fill="#e4584b"/><text x="1274" y="456" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">서로 섞으면 안 되는 것</text><text x="1274" y="494" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 모델 예측 ↔ 정답 라벨</text><text x="1274" y="525" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 에이전트 초안 ↔ 사람 승인</text><text x="1274" y="556" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 인용 오류 ↔ 내용 환각</text><text x="1274" y="587" font-size="18" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">• 품질 문제 ↔ 근거 모순</text></g><g><rect x="74" y="690" width="1772" height="270" rx="18" fill="#fff2df" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="690" width="8" height="270" rx="4" fill="#f59e0b"/><text x="102" y="732" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">왜 이 순서가 필요한가?</text><text x="102" y="770" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">답변을 먼저 바꾸거나 나중에 찾은 근거를 당시 입력처럼 넣으면 평가 대상 자체가 달라진다.</text><text x="102" y="809" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">구간 위치가 틀리면 모델 학습과 화면 강조가 다른 글자를 가리킨다.</text><text x="102" y="848" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">애매한 문장을 정상으로 세면 오탐은 줄어 보이지만 실제 성능이 좋아진 것은 아니다.</text><text x="102" y="887" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">따라서 정본 → 근거 → 구절 → 검수 → 승인 → 학습/평가 순서를 고정한다.</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거: pilot-25 GUIDELINES, detector300 입력·라벨·검증 코드, results-v1~v6 README</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>