<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 9/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">8단계 · 라벨 자료의 범위를 지켜 결과를 해석한다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">같은 100건이라도 추출 방식과 라벨 승인 상태가 다르면 성능 수치의 의미가 완전히 달라진다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><g><rect x="74" y="235" width="417" height="270" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="235" width="8" height="270" rx="4" fill="#5b5bd6"/><text x="102" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">역사 비교 63건</text><text x="102" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">개발 과정에서 반복 노출</text><text x="102" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">사람 최종 승인 전</text><text x="102" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">탐색·회귀 비교용</text></g><g><rect x="517" y="235" width="417" height="270" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="517" y="235" width="8" height="270" rx="4" fill="#2563eb"/><text x="545" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">고정 100건</text><text x="545" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">학습 제외 113건에서</text><text x="545" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">예측·라벨 비의존 해시 추출</text><text x="545" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">채점 가능 96건·잠정 평가</text></g><g><rect x="960" y="235" width="417" height="270" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="960" y="235" width="8" height="270" rx="4" fill="#f59e0b"/><text x="988" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">80% 시연 100건</text><text x="988" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정답·예측 확인 후 선정</text><text x="988" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">TP40·TN40·FP10·FN10</text><text x="988" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">전체 성능 추정 금지</text></g><g><rect x="1403" y="235" width="417" height="270" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1403" y="235" width="8" height="270" rx="4" fill="#e4584b"/><text x="1431" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">85% 시연 100건</text><text x="1431" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">정답·예측 확인 후 선정</text><text x="1431" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">TP42·TN43·FP7·FN8</text><text x="1431" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">전체 성능 추정 금지</text></g><text x="74" y="565" font-size="28" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">질문을 받았을 때의 권장 답변</text><g><rect x="74" y="600" width="1772" height="225" rx="18" fill="#fff2df" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="600" width="8" height="225" rx="4" fill="#f59e0b"/><text x="102" y="642" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“80%·85%는 어떻게 나온 수치인가요?”</text><text x="102" y="680" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“두 파일은 모델의 일반 성능을 추정하려고 무작위로 만든 평가세트가 아닙니다.”</text><text x="102" y="722" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“성공과 실패 사례를 함께 시연하기 위해 기존 잠정 라벨과 예측을 확인한 뒤 정답 비율을 80%와 85%로 맞춘 구성입니다.”</text><text x="102" y="764" font-size="20" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">“별도 고정 100건의 채점 가능 96건에서 v6 잠정 정확도는 67.71%였고, 이 역시 과거 노출 자료라 독립 성능으로 부르지 않습니다.”</text></g><g><rect x="74" y="855" width="555" height="120" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="855" width="8" height="120" rx="4" fill="#0f9f8f"/><text x="102" y="897" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">말할 수 있는 것</text><text x="102" y="935" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">구간 라벨링 절차와 파이프라인 구축</text><text x="102" y="966" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">오탐·누락 trade-off를 실제로 측정</text></g><g><rect x="656" y="855" width="555" height="120" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="656" y="855" width="8" height="120" rx="4" fill="#e4584b"/><text x="684" y="897" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">아직 말할 수 없는 것</text><text x="684" y="935" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">운영에서 검증된 80/85% 성능</text><text x="684" y="966" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">임의 질문에 대한 일반화 정확도</text></g><g><rect x="1238" y="855" width="608" height="120" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1238" y="855" width="8" height="120" rx="4" fill="#2563eb"/><text x="1266" y="897" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">다음 검증</text><text x="1266" y="935" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">독립 문서·질문·사람 승인 라벨</text><text x="1266" y="966" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">회사·오류유형별 불확실성 구간</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">시연 세트는 UI 흐름 설명용 · 성능 발표에는 고정 추출·승인 라벨·미노출 평가가 필요</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>