<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · 환각 구간 라벨링 상세 설명 · 6/9</text><text x="74" y="128" font-size="46" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">5단계 · 초안, 사람 의견, 조정안, 최종 승인을 분리한다</text><text x="74" y="169" font-size="21" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">누가 어떤 근거로 바꿨는지 추적하고, 승인 전 라벨을 학습 정답으로 내보내지 않는다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><g><rect x="74" y="235" width="417" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="235" width="8" height="260" rx="4" fill="#2563eb"/><text x="102" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">A. 에이전트 초안</text><text x="102" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거 대조 후보 span</text><text x="102" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">예측 결과와 분리</text><text x="102" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">human_approval=pending</text></g><line x1="493" y1="365" x2="512" y2="365" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="517" y="235" width="417" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="517" y="235" width="8" height="260" rx="4" fill="#0f9f8f"/><text x="545" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">B. 사람 제출 의견</text><text x="545" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">동의·수정·재검토</text><text x="545" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">원본 파일·해시 보존</text><text x="545" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">서로 다른 문항 배정 가능</text></g><line x1="936" y1="365" x2="955" y2="365" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="960" y="235" width="417" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="960" y="235" width="8" height="260" rx="4" fill="#f59e0b"/><text x="988" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">C. 통합 조정안</text><text x="988" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">구·신 라벨과 이유</text><text x="988" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">근거 anchor·출처 기록</text><text x="988" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">보류/품질 메모 분리</text></g><line x1="1379" y1="365" x2="1398" y2="365" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="1403" y="235" width="417" height="260" rx="18" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1403" y="235" width="8" height="260" rx="4" fill="#e4584b"/><text x="1431" y="277" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">D. 최종 사람 승인</text><text x="1431" y="315" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">승인자·시각·대상 span</text><text x="1431" y="357" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">approved_spans 확정</text><text x="1431" y="399" font-size="17" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">training_ready=true 가능</text></g><text x="74" y="555" font-size="28" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">현재 25문항 검수의 실제 상태</text><rect x="74" y="590" width="270" height="130" rx="16" fill="#eaf1ff" stroke="#d8e2ee"/><text x="96" y="637" font-size="34" font-weight="900" fill="#2563eb" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">25</text><text x="96" y="673" font-size="18" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">검수 문항</text><rect x="369" y="590" width="270" height="130" rx="16" fill="#e8f8f5" stroke="#d8e2ee"/><text x="391" y="637" font-size="34" font-weight="900" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">68</text><text x="391" y="673" font-size="18" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">기존 구절</text><text x="391" y="702" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">동의 65 · 수정 3</text><rect x="664" y="590" width="270" height="130" rx="16" fill="#eaf1ff" stroke="#d8e2ee"/><text x="686" y="637" font-size="34" font-weight="900" fill="#2563eb" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">88</text><text x="686" y="673" font-size="18" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">통합 구절</text><rect x="959" y="590" width="270" height="130" rx="16" fill="#e8f8f5" stroke="#d8e2ee"/><text x="981" y="637" font-size="34" font-weight="900" fill="#0f9f8f" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">70</text><text x="981" y="673" font-size="18" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">채택 제안</text><rect x="1254" y="590" width="270" height="130" rx="16" fill="#eaf1ff" stroke="#d8e2ee"/><text x="1276" y="637" font-size="34" font-weight="900" fill="#2563eb" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">16</text><text x="1276" y="673" font-size="18" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">보류</text><rect x="1549" y="590" width="270" height="130" rx="16" fill="#ffe9e6" stroke="#d8e2ee"/><text x="1571" y="637" font-size="34" font-weight="900" fill="#e4584b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">0</text><text x="1571" y="673" font-size="18" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">최종 승인</text><g><rect x="74" y="758" width="860" height="205" rx="18" fill="#efedff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="758" width="8" height="205" rx="4" fill="#5b5bd6"/><text x="102" y="800" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">왜 검수자 간 일치도를 아직 계산하지 않았나?</text><text x="102" y="838" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">팀원별로 서로 다른 문항을 맡아 같은 사례를 독립적으로 이중 검수하지 않았다.</text><text x="102" y="881" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">따라서 IAA를 만들 수 없으며, 25문항은 의도 표본이자 개발 노출 자료다.</text></g><g><rect x="960" y="758" width="886" height="205" rx="18" fill="#ffe9e6" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="960" y="758" width="8" height="205" rx="4" fill="#e4584b"/><text x="988" y="800" font-size="23" font-weight="800" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">승인 전 처리</text><text x="988" y="838" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">UNCERTAIN·HOLD·미검수 토큰은 정상(O)으로 채우지 않는다.</text><text x="988" y="881" font-size="19" font-weight="500" fill="#14233a" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">학습에서는 마스킹/제외하고, 평가에서는 unknown 또는 보류로 공개한다.</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-size="14" font-weight="500" fill="#52647b" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">현재 상태: submitted review 접수 완료 · final human approval pending · training_ready=false</text><text x="1846" y="1055" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">ASTRA · ko-LettuceDetect</text></svg>