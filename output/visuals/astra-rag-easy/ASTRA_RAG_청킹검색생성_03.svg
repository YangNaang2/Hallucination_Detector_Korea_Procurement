<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16314f" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#91a4bb"/></marker></defs><rect width="1920" height="1080" fill="#f6f9fc"/><rect width="18" height="1080" fill="#0f9f8f"/><text x="74" y="70" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="18" font-weight="800" fill="#0f9f8f" text-anchor="start">ASTRA · 권한형 RAG 쉬운 설명 · 3/4</text><text x="74" y="128" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="46" font-weight="800" fill="#14233a" text-anchor="start">하이브리드 검색은 “정확한 단어”와 “비슷한 의미”를 함께 찾는다</text><text x="74" y="169" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="21" font-weight="500" fill="#52647b" text-anchor="start">한쪽 검색의 약점을 다른 쪽이 보완하고, RRF가 두 순위를 공통 parent 기준으로 합친다.</text><line x1="74" y1="193" x2="1846" y2="193" stroke="#d8e2ee"/><circle cx="220" cy="350" r="112" fill="#eaf1ff" stroke="#2563eb" stroke-width="4"/><circle cx="170" cy="320" r="36" fill="none" stroke="#2563eb" stroke-width="12"/><line x1="197" y1="347" x2="250" y2="400" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/><text x="220" y="492" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="26" font-weight="900" fill="#2563eb" text-anchor="middle">사용자 질문</text><line x1="340" y1="350" x2="425" y2="350" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="438" y="235" width="450" height="300" rx="18" fill="#eaf1ff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="438" y="235" width="8" height="300" rx="4" fill="#2563eb"/><text x="466" y="278" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="800" fill="#14233a" text-anchor="start">A · Lexical 검색</text><text x="466" y="319" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">한국어 2글자 단위로 일치 탐색</text><text x="466" y="360" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">영어·제품명·숫자는 exact 처리</text><text x="466" y="401" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">금액·날짜·인증 코드에 강함</text><text x="466" y="442" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">표현이 달라지면 놓칠 수 있음</text></g><g><rect x="438" y="565" width="450" height="300" rx="18" fill="#e8f8f5" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="438" y="565" width="8" height="300" rx="4" fill="#0f9f8f"/><text x="466" y="608" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="800" fill="#14233a" text-anchor="start">B · Dense 검색</text><text x="466" y="649" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">질문과 window를 E5로 임베딩</text><text x="466" y="690" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">단어가 달라도 의미가 비슷하면 탐색</text><text x="466" y="731" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">패러프레이즈·설명형 질문에 강함</text><text x="466" y="772" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#14233a" text-anchor="start">숫자·고유명사를 흐릴 수 있음</text></g><line x1="900" y1="385" x2="1005" y2="500" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><line x1="900" y1="715" x2="1005" y2="600" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1018" y="400" width="355" height="300" rx="26" fill="#fff2df" stroke="#f59e0b" stroke-width="4" filter="url(#shadow)"/><text x="1195" y="463" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="30" font-weight="900" fill="#f59e0b" text-anchor="middle">RRF 순위 결합</text><text x="1195" y="520" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#14233a" text-anchor="middle">각 검색의 순위만 이용</text><text x="1195" y="560" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#1e4970" text-anchor="middle">RRF(d)=Σ 1/(60+rank)</text><text x="1195" y="610" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="17" font-weight="600" fill="#52647b" text-anchor="middle">점수 크기가 달라도 결합 가능</text><text x="1195" y="650" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="17" font-weight="600" fill="#52647b" text-anchor="middle">같은 parent로 다시 집계</text><line x1="1385" y1="550" x2="1465" y2="550" stroke="#91a4bb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="1478" y="350" width="368" height="400" rx="18" fill="#fff" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="1478" y="350" width="8" height="400" rx="4" fill="#e4584b"/><text x="1506" y="393" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="800" fill="#14233a" text-anchor="start">최종 검색 결과</text><text x="1506" y="434" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#52647b" text-anchor="start">parent 최대 6개</text><text x="1506" y="477" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#52647b" text-anchor="start">중복 window는 한 근거로 통합</text><text x="1506" y="520" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#52647b" text-anchor="start">문서·회사·권한 metadata 유지</text><text x="1506" y="563" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#52647b" text-anchor="start">생성 prompt에는 최대 4개</text><text x="1506" y="606" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" fill="#52647b" text-anchor="start">citation [1]~[4] 부여</text></g><g><rect x="74" y="890" width="1772" height="92" rx="18" fill="#eef4fa" stroke="#d8e2ee" filter="url(#shadow)"/><rect x="74" y="890" width="8" height="92" rx="4" fill="#1e4970"/><text x="102" y="933" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="800" fill="#14233a" text-anchor="start">쉽게 말하면</text><text x="102" y="974" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="20" font-weight="500" fill="#14233a" text-anchor="start">키워드 검색은 “똑같이 쓰인 말”을, 임베딩 검색은 “뜻이 비슷한 말”을 찾는다. RRF는 두 추천 목록에서 자주 상위에 나온 근거를 우선한다.</text></g><line x1="74" y1="1024" x2="1846" y2="1024" stroke="#d8e2ee"/><text x="74" y="1055" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="14" font-weight="500" fill="#52647b" text-anchor="start">현재 구현은 lexical+dense+RRF이며, 별도 그래프 DB 기반 GraphRAG가 아니다.</text><text x="1846" y="1055" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="14" font-weight="700" fill="#1e4970" text-anchor="end">ASTRA · ko-LettuceDetect</text></svg>