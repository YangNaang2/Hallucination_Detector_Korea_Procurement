<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background:#090d16; font-family:'Pretendard', 'Noto Sans KR', sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Track Accent Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ==================== Header ==================== -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="1500" height="74" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="2"/>
    <rect x="24" y="16" width="8" height="42" rx="4" fill="url(#headerGrad)"/>
    <text x="44" y="42" fill="#f8fafc" font-size="24" font-weight="800">통합 프로젝트 잔여 로드맵 &amp; 4대 실행 과제 (Next Actions)</text>
    <text x="44" y="64" fill="#94a3b8" font-size="14" font-weight="600">외교부 표준 가이드라인 충족: 비취인가 보안 RAG 구축 및 구절 단위 환각 검증 데모 패키징</text>
    <rect x="1320" y="20" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="1397" y="42" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">목표 마감: 10/2</text>
  </g>

  <!-- ==================== Track 1: Data Pipeline ==================== -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="350" height="600" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    
    <!-- Header -->
    <rect x="18" y="18" width="314" height="46" rx="8" fill="#1e293b"/>
    <circle cx="42" cy="41" r="14" fill="url(#blueGrad)"/>
    <text x="42" y="46" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    <text x="68" y="46" fill="#e2e8f0" font-size="17" font-weight="800">데이터 수집 &amp; RBAC 구축</text>

    <!-- Meta Info -->
    <rect x="18" y="74" width="314" height="34" rx="6" fill="#0f172a"/>
    <text x="32" y="96" fill="#38bdf8" font-size="13" font-weight="700">담당: 2인 (파트 A) | 소요: 2~3일</text>

    <!-- Task 1 -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="314" height="125" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#38bdf8" font-size="14" font-weight="800">1-1. 나라장터 공고 수집 (Level 1)</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• IT/SW/AI 입찰공고 및 RFP 10~20건 확보</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• 공고 메타(공고명, 예산, 마감일) 파싱</text>
      <text x="14" y="96" fill="#cbd5e1" font-size="13">• 참가자격, 평가기준 중심 700자 청킹</text>
      <text x="14" y="116" fill="#64748b" font-size="12">→ Level 1 (공개 문서) 태깅 완료</text>
    </g>

    <!-- Task 2 -->
    <g transform="translate(18, 255)">
      <rect x="0" y="0" width="314" height="140" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#38bdf8" font-size="14" font-weight="800">1-2. 가상 사내 기밀 DB 작성</text>
      <text x="14" y="52" fill="#60a5fa" font-size="13" font-weight="700">[Level 2 대외비] 사내 실적 (5~10건)</text>
      <text x="14" y="72" fill="#94a3b8" font-size="12">• 유사 사업 수주증명서, 엔지니어 M/M 공수표</text>
      <text x="14" y="96" fill="#f87171" font-size="13" font-weight="700">[Level 3 기밀] 투찰 전략 (3~5건)</text>
      <text x="14" y="116" fill="#94a3b8" font-size="12">• 투찰 예정가, 원가 내역서, 컨소시엄 협약</text>
      <text x="14" y="132" fill="#64748b" font-size="11">→ chunks.jsonl에 보안 레벨(1~3) 주입</text>
    </g>

    <!-- Task 3 -->
    <g transform="translate(18, 405)">
      <rect x="0" y="0" width="314" height="85" rx="8" fill="#131d31" stroke="#0284c7" stroke-dasharray="3 3"/>
      <text x="14" y="26" fill="#38bdf8" font-size="14" font-weight="800">1-3. 최종 데이터셋 패키징</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="13">• 약 300~500개 보안 청크 완비</text>
      <text x="14" y="72" fill="#cbd5e1" font-size="13">• RBAC 인덱싱 모듈로 인계</text>
    </g>
  </g>

  <!-- ==================== Track 2: Security RAG Engine ==================== -->
  <g transform="translate(430, 130)">
    <rect x="0" y="0" width="350" height="600" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    
    <!-- Header -->
    <rect x="18" y="18" width="314" height="46" rx="8" fill="#1e293b"/>
    <circle cx="42" cy="41" r="14" fill="url(#purpleGrad)"/>
    <text x="42" y="46" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    <text x="68" y="46" fill="#e2e8f0" font-size="17" font-weight="800">비취인가 RAG 검색 모듈</text>

    <!-- Meta Info -->
    <rect x="18" y="74" width="314" height="34" rx="6" fill="#0f172a"/>
    <text x="32" y="96" fill="#a78bfa" font-size="13" font-weight="700">담당: 1인 (파트 B) | 소요: 1~2일</text>

    <!-- Task 1 -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="314" height="115" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#c084fc" font-size="14" font-weight="800">2-1. 임베딩 인덱싱 (bge-m3)</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• BAAI/bge-m3 모델로 512d 임베딩</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• vectors.npy + chunks.jsonl 빌드</text>
      <text x="14" y="96" fill="#94a3b8" font-size="12">• 로컬 Numpy 코사인 유사도 검색 최적화</text>
    </g>

    <!-- Task 2 -->
    <g transform="translate(18, 245)">
      <rect x="0" y="0" width="314" height="120" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#c084fc" font-size="14" font-weight="800">2-2. 사용자 세션 DB (users.json)</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• 신입 실무자 (Level 1: 공개 문서만)</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• 제안 책임자 (Level 2: 실적 증명서 포함)</text>
      <text x="14" y="96" fill="#cbd5e1" font-size="13">• 사업 본부장 (Level 3: 원가/투찰가 전체)</text>
    </g>

    <!-- Task 3 -->
    <g transform="translate(18, 375)">
      <rect x="0" y="0" width="314" height="115" rx="8" fill="#1e1b4b" stroke="#8b5cf6"/>
      <text x="14" y="26" fill="#c084fc" font-size="14" font-weight="800">2-3. 하드 필터링 로직 구현</text>
      <text x="14" y="52" fill="#facc15" font-size="12" font-family="monospace">filter: chunk.level &lt;= user.level</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• 비인가 문서는 검색 단계에서 원천 은닉</text>
      <text x="14" y="96" fill="#34d399" font-size="12" font-weight="bold">✓ 100% 폐쇄망: 외부 API 통신 Zero</text>
    </g>
  </g>

  <!-- ==================== Track 3: Core Model Integration ==================== -->
  <g transform="translate(810, 130)">
    <rect x="0" y="0" width="350" height="600" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    
    <!-- Header -->
    <rect x="18" y="18" width="314" height="46" rx="8" fill="#1e293b"/>
    <circle cx="42" cy="41" r="14" fill="url(#magentaGrad)"/>
    <text x="42" y="46" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    <text x="68" y="46" fill="#e2e8f0" font-size="17" font-weight="800">코어 탐지기 통합 (엔진 결합)</text>

    <!-- Meta Info -->
    <rect x="18" y="74" width="314" height="34" rx="6" fill="#0f172a"/>
    <text x="32" y="96" fill="#fb7185" font-size="13" font-weight="700">담당: 1인 (양진우 / 파트 C) | 소요: 1일</text>

    <!-- Task 1 -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="314" height="115" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#fb7185" font-size="14" font-weight="800">3-1. klue/roberta 가중치 마운트</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• 기존 학습 완료된 110M 모델 로드</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• F1 0.6980 검증된 토큰 분류 헤드</text>
      <text x="14" y="96" fill="#38bdf8" font-size="12">• CPU 환경 0.1초 이내 초고속 추론</text>
    </g>

    <!-- Task 2 -->
    <g transform="translate(18, 245)">
      <rect x="0" y="0" width="314" height="120" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#fb7185" font-size="14" font-weight="800">3-2. 긴 RFP 공고 특화 알고리즘 결합</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• 슬라이딩 윈도우: 512 길이 한계 우회</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• min2 집계: 장문 공고 과소 탐지 방지</text>
      <text x="14" y="96" fill="#94a3b8" font-size="12">• 환각 구절 문자열 좌표(Span) 매핑</text>
    </g>

    <!-- Task 3 -->
    <g transform="translate(18, 375)">
      <rect x="0" y="0" width="314" height="115" rx="8" fill="#1e1b4b" stroke="#f43f5e"/>
      <text x="14" y="26" fill="#fb7185" font-size="14" font-weight="800">3-3. 추론 파이프라인 인터페이스</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• 입력: [인가 청크 Context] + [답변]</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• 출력: 토큰별 레이블(0/1) + 위험 구간</text>
      <text x="14" y="96" fill="#facc15" font-size="12">→ Gradio UI 연동 API 래핑 완료</text>
    </g>
  </g>

  <!-- ==================== Track 4: Evaluation & UI Demo ==================== -->
  <g transform="translate(1190, 130)">
    <rect x="0" y="0" width="360" height="600" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    
    <!-- Header -->
    <rect x="18" y="18" width="324" height="46" rx="8" fill="#1e293b"/>
    <circle cx="42" cy="41" r="14" fill="url(#emeraldGrad)"/>
    <text x="42" y="46" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    <text x="68" y="46" fill="#e2e8f0" font-size="17" font-weight="800">평가셋 검증 &amp; 데모 UI 완성</text>

    <!-- Meta Info -->
    <rect x="18" y="74" width="324" height="34" rx="6" fill="#0f172a"/>
    <text x="32" y="96" fill="#34d399" font-size="13" font-weight="700">담당: 2인 (파트 D, E) | 소요: 2~3일</text>

    <!-- Task 1 -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="324" height="115" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#34d399" font-size="14" font-weight="800">4-1. 입찰 도메인 환각 평가셋 (50문항)</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• 자격 요건 왜곡(실적/매출/업력 변조)</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• 일정 및 배점 감점 기준 뒤바꿈</text>
      <text x="14" y="96" fill="#94a3b8" font-size="12">→ 도메인 이전 성능 및 탐지율 실측</text>
    </g>

    <!-- Task 2 -->
    <g transform="translate(18, 245)">
      <rect x="0" y="0" width="324" height="120" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#34d399" font-size="14" font-weight="800">4-2. Gradio 3단 시연 화면 구현</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• [상단] 사용자 인가 세션 전환 토글</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• [좌측] 공고 선택 및 질의응답 챗</text>
      <text x="14" y="96" fill="#cbd5e1" font-size="13">• [우측] 형광펜 밑줄 및 원문 증거 팝업</text>
    </g>

    <!-- Task 3 -->
    <g transform="translate(18, 375)">
      <rect x="0" y="0" width="324" height="115" rx="8" fill="#064e3b" stroke="#10b981"/>
      <text x="14" y="26" fill="#34d399" font-size="14" font-weight="800">4-3. 3분 시연 시나리오 리허설</text>
      <text x="14" y="52" fill="#cbd5e1" font-size="13">• 1단계: 실무자 접근 시 기밀 차단</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="13">• 2단계: PM 계정 질의 시 환각 지목</text>
      <text x="14" y="96" fill="#facc15" font-size="12" font-weight="bold">→ "3년 5억 실적 충족" 오답 완벽 방어</text>
    </g>
  </g>

  <!-- ==================== Horizontal Milestone Timeline ==================== -->
  <g transform="translate(50, 755)">
    <rect x="0" y="0" width="1500" height="115" rx="14" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    
    <text x="24" y="32" fill="#f8fafc" font-size="16" font-weight="800">통합 마일스톤 (Schedule)</text>

    <!-- Milestone Steps -->
    <g transform="translate(24, 46)">
      <!-- Line -->
      <line x1="80" y1="28" x2="1360" y2="28" stroke="#334155" stroke-width="3"/>

      <!-- M1 -->
      <circle cx="80" cy="28" r="14" fill="#0284c7"/>
      <text x="80" y="33" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">W1</text>
      <text x="80" y="58" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">공고 데이터 &amp; RBAC 수집</text>
      <text x="80" y="74" fill="#64748b" font-size="11" text-anchor="middle">나라장터 + 가상사내 (L1~L3)</text>

      <!-- M2 -->
      <circle cx="500" cy="28" r="14" fill="#7c3aed"/>
      <text x="500" y="33" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">W2</text>
      <text x="500" y="58" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">보안 RAG &amp; 엔진 통합</text>
      <text x="500" y="74" fill="#64748b" font-size="11" text-anchor="middle">RBAC 하드 필터 + klue 로드</text>

      <!-- M3 -->
      <circle cx="930" cy="28" r="14" fill="#e11d48"/>
      <text x="930" y="33" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">W3</text>
      <text x="930" y="58" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">형광펜 UI &amp; 진단셋 채점</text>
      <text x="930" y="74" fill="#64748b" font-size="11" text-anchor="middle">Gradio 연동 및 탐지율 산출</text>

      <!-- M4 -->
      <circle cx="1360" cy="28" r="14" fill="#059669"/>
      <text x="1360" y="33" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">W4</text>
      <text x="1360" y="58" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle">최종 발표 &amp; 데모 시연</text>
      <text x="1360" y="74" fill="#34d399" font-size="11" text-anchor="middle">10/2 완벽 완주</text>
    </g>
  </g>
</svg>
