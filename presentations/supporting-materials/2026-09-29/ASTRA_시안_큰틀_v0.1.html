<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRA 시안 — 큰 틀</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
:root{
  --bg:#0a0f1e; --panel:#121a2e; --panel2:#182238; --line:#243047; --text:#e6ebf5; --muted:#8b97b1;
  --accent:#4f8cff; --warn:#f5c04a; --ok:#6fcf97; --bad:#ff6b6b; --glow:#ffd27a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.hidden{display:none!important}

/* ---------- 로그인 ---------- */
#login{position:fixed;inset:0;background:radial-gradient(1200px 600px at 70% 20%,#16224a 0%,var(--bg) 60%);display:flex;align-items:center;justify-content:center;z-index:50}
.login-card{width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.login-card h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}
.login-card .sub{color:var(--muted);margin:0 0 20px}
.login-card label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}
.login-card select{width:100%}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.levels button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:left}
.levels button:hover{border-color:var(--accent)}
.levels b{display:block;font-size:15px;margin-bottom:2px}
.levels small{color:var(--muted);font-size:11px}
.demo-note{margin-top:18px;padding:10px 12px;border-radius:8px;background:#2a2410;color:var(--warn);font-size:12px;border:1px solid #4a3f1a}

/* ---------- 헤더 ---------- */
#app{height:100%;display:flex;flex-direction:column}
header{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
header .brand{font-weight:700;letter-spacing:1px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.badge.level{border-color:#2d4f8f;background:#15264a}
.badge.demo{border-color:#4a3f1a;background:#2a2410;color:var(--warn)}
.badge.off{color:var(--muted)}
header .spacer{flex:1}
header button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted)}

/* ---------- 본문 ---------- */
main{flex:1;display:grid;grid-template-columns:minmax(380px,40%) 1fr;min-height:0}
#left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1f3a6e}
.msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.msg .foot{margin-top:8px;color:var(--muted);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--text)}
.state{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.state.src-test{background:#2a2410;border-color:#4a3f1a;color:var(--warn)}
.state.src-saved{background:#1b2a44;border-color:#2d4f8f;color:#9cc0ff}
.state.src-live{background:#123626;border-color:#1f5a3f;color:var(--ok)}
.state.det-none{color:var(--muted)}
.state.det-partial{background:#2a2410;border-color:#4a3f1a;color:var(--warn)}
.state.det-zero{color:var(--muted)}
.state.det-found{background:#2a2410;border-color:#4a3f1a;color:var(--warn)}
.sus{background:rgba(245,192,74,.16);border-bottom:2px dotted var(--warn);cursor:pointer;padding:0 1px;border-radius:2px}
.sus:hover{background:rgba(245,192,74,.3)}
.sus .tag{font-size:10px;color:var(--warn);margin-left:2px;vertical-align:super}

/* 결과 목록 */
#results{flex:0 0 46%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel);min-height:0;transition:flex-basis .25s}
#results.collapsed{flex-basis:40px}
#results .head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:0 0 40px}
#results .head b{font-size:13px}
#results .head .count{color:var(--muted);font-size:12px}
#results .head button.toggle{margin-left:auto;background:transparent;border:0;color:var(--muted)}
#filters{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#filters input{flex:1 1 140px;min-width:120px}
#filters select{flex:0 0 auto}
#list{flex:1;overflow:auto;min-height:0}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--panel2)}
.row.active{background:#1b2f57;border-left:3px solid var(--accent)}
.row .rank{color:var(--muted);font-weight:700;text-align:center;padding-top:2px}
.row .t{font-weight:600;line-height:1.35}
.row .s{color:var(--muted);font-size:12px;margin-top:3px}
.row .why{color:#9cc0ff;font-size:12px;margin-top:4px}
.row .b{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.more{display:block;width:100%;padding:10px;background:transparent;border:0;color:var(--muted)}
.empty{padding:18px;color:var(--muted);text-align:center}

/* 입력 */
#inputbar{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel)}
#target{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
#target .tchip{background:#15264a;border:1px solid #2d4f8f;color:#cfe0ff;padding:3px 10px;border-radius:999px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#target .tchip.browse{background:var(--panel2);border-color:var(--line);color:var(--muted)}
#target button{white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--muted)}
#inputrow{display:flex;gap:8px}
#inputrow input{flex:1}
#inputrow button{background:var(--accent);border:0;border-radius:8px;padding:0 16px;color:#fff;font-weight:600}

/* 지도 */
#right{display:flex;flex-direction:column;min-height:0;position:relative}
#map{flex:1;min-height:0;background:#050813}
#mapcard{position:absolute;top:12px;right:12px;width:280px;background:rgba(12,18,34,.92);border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(6px)}
#mapcard .t{font-weight:600;line-height:1.35;margin-bottom:6px}
#mapcard .kv{display:grid;grid-template-columns:52px 1fr;gap:3px 8px;font-size:12px;color:var(--muted)}
#mapcard .kv span:nth-child(even){color:var(--text)}
#maplegend{position:absolute;left:12px;bottom:172px;font-size:11px;color:var(--muted);background:rgba(12,18,34,.8);padding:6px 9px;border-radius:8px;border:1px solid var(--line)}
#info{flex:0 0 160px;border-top:1px solid var(--line);background:var(--panel);padding:12px 16px;overflow:auto}
#info .ph{color:var(--muted);height:100%;display:flex;align-items:center;justify-content:center}
#info h3{margin:0 0 6px;font-size:15px}
#info .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 16px;font-size:12px}
#info .grid div{color:var(--muted)}
#info .grid div b{display:block;color:var(--text);font-weight:500;margin-top:2px}

/* 근거 패널 */
#evidence{position:absolute;top:0;right:0;bottom:160px;width:360px;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.4)}
#evidence h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
#evidence h3 button{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:2px 8px}
#evidence .sec{margin-bottom:14px}
#evidence .sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500}
#evidence .q{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;line-height:1.5;white-space:pre-wrap;font-size:13px}
#evidence .q mark{background:rgba(245,192,74,.25);color:inherit}
.note{font-size:11px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>

<!-- ================= 로그인(시연용) ================= -->
<div id="login">
  <div class="login-card">
    <h1>ASTRA</h1>
    <p class="sub">나라장터 공고 검토 · 근거와 환각 의심 구간 확인</p>
    <label>회사 (가상 기업)</label>
    <select id="company">
      <option value="한빛IT">한빛IT</option>
      <option value="가상기업 C02">가상기업 C02</option>
      <option value="가상기업 C03">가상기업 C03</option>
    </select>
    <label>열람 등급 — 시연 계정 선택</label>
    <div class="levels">
      <button data-level="L1"><b>L1</b><small>공개 공고·공개 자료</small></button>
      <button data-level="L2"><b>L2</b><small>회사 내부 자료</small></button>
      <button data-level="L3"><b>L3</b><small>회사 민감 자료</small></button>
    </div>
    <div class="demo-note">시연용 로그인입니다. 실제 인증·권한 검사가 아니며, 이 시안에서는 등급과 무관하게 공개(L1) 공고만 검색됩니다.</div>
  </div>
</div>

<!-- ================= 메인 ================= -->
<div id="app" class="hidden">
  <header>
    <span class="brand">ASTRA</span>
    <span class="badge" id="hCompany">한빛IT</span>
    <span class="badge level" id="hLevel">열람 등급 L1</span>
    <span class="badge off" id="hInternal">내부 자료 검색: 이 시안에서 비활성</span>
    <span class="spacer"></span>
    <span class="badge demo">시연 모드 · 모델 미연결</span>
    <button id="logout">로그아웃</button>
  </header>

  <main>
    <!-- 왼쪽 -->
    <section id="left">
      <div id="chat"></div>

      <div id="results">
        <div class="head">
          <b>검색 결과</b><span class="count" id="rcount">공개 공고 51건 · 조건 없음</span>
          <button class="toggle" id="rtoggle" title="접기/펼치기">▾</button>
        </div>
        <div id="filters">
          <input id="fText" placeholder="공고명·기관 키워드 직접 검색">
          <select id="fRegion"><option value="">지역 전체</option></select>
          <select id="fTag"><option value="">분야 전체</option></select>
          <select id="fBudget">
            <option value="">금액 전체</option>
            <option value="100000000">1억 이하</option>
            <option value="200000000">2억 이하</option>
            <option value="300000000">3억 이하</option>
            <option value="500000000">5억 이하</option>
          </select>
        </div>
        <div id="list"></div>
      </div>

      <div id="inputbar">
        <div id="target">
          <span>현재 대상</span>
          <span class="tchip browse" id="tchip">전체 공개 공고에서 탐색 중</span>
          <button id="tback" class="hidden">탐색으로 돌아가기</button>
        </div>
        <div id="inputrow">
          <input id="q" placeholder="원하는 공고를 짧게 또는 자세히 입력하세요 (예: 서울 AI 유지보수 2억 이하)">
          <button id="send">보내기</button>
        </div>
      </div>
    </section>

    <!-- 오른쪽 -->
    <section id="right">
      <div id="map"></div>
      <div id="mapcard" class="hidden"></div>
      <div id="maplegend">● 불빛 = 공고 위치(발주기관 소재지 기준) · 밝을수록 검색 조건과 가까움</div>
      <div id="info"><div class="ph">공고를 클릭하면 여기에 간단한 정보가 표시됩니다</div></div>
      <aside id="evidence" class="hidden"></aside>
    </section>
  </main>
</div>

<script>

// ================= 채팅 =================
function addMsg(role, text, opts={}){
  const m = el("div","msg "+role);
  if(opts.meta){ const meta=el("div","meta"); opts.meta.forEach(([cls,t,title])=>{const s=el("span","state "+cls,t); if(title) s.title=title; meta.appendChild(s);}); m.appendChild(meta); }
  if(opts.spans){ renderAnswer(m, text, opts.spans); } else { m.appendChild(document.createTextNode(text)); }
  if(opts.chips){ const c=el("div","chips"); opts.chips.forEach(([label,fn])=>{const b=el("button","chip",label); b.addEventListener("click",fn); c.appendChild(b);}); m.appendChild(c); }
  if(opts.foot){ m.appendChild(el("div","foot",opts.foot)); }

}
function resetChat(){

  addMsg("bot", `${S.company} · 열람 등급 ${S.level}로 들어왔습니다.\n원하는 공고를 자유롭게 적어 주세요. 짧게 적어도 되고, 지역·분야·금액을 한꺼번에 적어도 됩니다. 아래 검색창과 필터로 직접 찾을 수도 있습니다.`, {
    chips:[["서울 지역 AI 관련 용역", ()=>askBrowse("서울 지역 AI 관련 용역")],["예산 2억 이하 유지보수", ()=>askBrowse("예산 2억 이하 유지보수")],["부산 플랫폼 구축", ()=>askBrowse("부산 플랫폼 구축")]]
  });
  S.query={regions:[],tags:[],budgetMax:null,text:""}; syncFilters(); runSearch(); deselect(false);
}

// ================= 자연어 → 조건 =================
function parseQuery(text){
  const q={regions:[],tags:[],budgetMax:null,text:""};
  REGIONS.forEach(r=>{ if(text.includes(r)) q.regions.push(r); });
  KEYWORDS.forEach(([k,t])=>{ if(text.includes(k) && !q.tags.includes(t)) q.tags.push(t); });
  let m = text.match(/(\d+(?:\.\d+)?)\s*억\s*(이하|미만|아래|까지)?/); if(m) q.budgetMax = Math.round(parseFloat(m[1])*1e8);
  m = text.match(/(\d+)\s*천만\s*(이하|미만)?/); if(m && !q.budgetMax) q.budgetMax = parseInt(m[1])*1e7;
  // 남는 단어는 자유 키워드로
  let rest = text; REGIONS.forEach(r=>rest=rest.replaceAll(r,"")); KEYWORDS.forEach(([k])=>rest=rest.replaceAll(k,""));
  rest = rest.replace(/\d+(?:\.\d+)?\s*(억|천만)\s*(이하|미만|아래|까지)?/g,"").replace(/(지역|관련|용역|공고|사업|찾고|있어|보여줘|알려줘|의|을|를|이|가|에서|이하|이상|예산|금액)/g," ");
  q.text = rest.split(/\s+/).filter(w=>w.length>=2).slice(0,3).join(" ");
  return q;
}
function askBrowse(text){
  addMsg("user", text);
  S.query = parseQuery(text); syncFilters(); runSearch();
  const cond = describeQuery();
  addMsg("bot", `조건으로 이해한 내용: ${cond}\n적합도순으로 ${S.results.length}건을 아래 검색 결과에 정리했습니다. 공고를 클릭하면 지도와 함께 간단한 설명을 보여 드립니다.`, {foot:"이 시안의 조건 해석은 규칙 기반(지역·분야·금액·키워드)이며, 마감일 조건은 아직 지원하지 않습니다."});
}
function describeQuery(){
  const q=S.query, parts=[];
  if(q.regions.length) parts.push("지역 "+q.regions.join("·"));
  if(q.tags.length) parts.push("분야 "+q.tags.join("·"));
  if(q.budgetMax) parts.push("예산 "+won(q.budgetMax)+" 이하");
  if(q.text) parts.push("키워드 '"+q.text+"'");
  return parts.length? parts.join(" / ") : "조건 없음(전체 목록)";
}

// ================= 검색·순위 =================
// 지역·금액은 필수 조건(걸러냄), 분야·키워드는 적합도 점수(순위). 추천 이유는 맞은 조건을 그대로 나열한다.
function scoreNotice(n){
  const q=S.query; let s=0, ok=true; const why=[];
  if(q.regions.length){ if(q.regions.includes(n.sido)){ s+=3; why.push(n.sido);} else ok=false; }
  if(q.budgetMax){ if(n.budget<=q.budgetMax){ s+=2; why.push("예산 "+won(q.budgetMax)+" 이하"); } else ok=false; }
  if(q.tags.length){ const hit=q.tags.filter(t=>n.tags.includes(t)); if(hit.length){ s+=2*hit.length; why.push(...hit);} }
  if(q.text){ const words=q.text.split(" "); const hit=words.filter(w=>n.title.includes(w)||n.agency.includes(w)); if(hit.length){ s+=hit.length; why.push("'"+hit.join("','")+"'"); } }
  return {s, ok, why};
}
function runSearch(){
  const q=S.query; const hasCond = q.regions.length||q.tags.length||q.budgetMax||q.text;
  let arr = NOTICES.map(n=>({n, ...scoreNotice(n)}));
  if(hasCond){ arr = arr.filter(x=>x.ok && x.s>0); arr.sort((a,b)=>b.s-a.s || a.n.id-b.n.id); }
  S.results = arr; S.shown = 0;
  $("#rcount").textContent = hasCond ? `${arr.length}건 · ${describeQuery()}` : "공개 공고 51건 · 조건 없음";
  $("#list").textContent=""; renderMore(); updateMapHits();
}
function renderMore(){
  const list=$("#list"); const old=list.querySelector(".more"); if(old) old.remove();
  const slice=S.results.slice(S.shown, S.shown+10);
  if(!S.results.length){ list.appendChild(el("div","empty","조건에 맞는 공고가 없습니다. 조건을 줄여 보세요.")); return; }
  slice.forEach((x,i)=>{
    const r=el("div","row"); r.dataset.id=x.n.id; if(S.selected&&S.selected.id===x.n.id) r.classList.add("active");
    r.appendChild(el("div","rank",String(S.shown+i+1)));
    const mid=el("div"); mid.appendChild(el("div","t",x.n.title));
    mid.appendChild(el("div","s",`${x.n.agency} · ${x.n.sido} ${x.n.sigungu} · ${x.n.tags.join("/")}`));
    mid.appendChild(el("div","why", x.why.length? x.why.join(" · ")+" 조건 일치" : "조건 없음 — 기본 순서"));
    r.appendChild(mid);
    r.appendChild(el("div","b",won(x.n.budget)));
    r.addEventListener("click",()=>selectNotice(x.n));
    list.appendChild(r);
  });
  S.shown += slice.length;
  if(S.shown < S.results.length){ const b=el("button","more",`더 보기 (${S.shown}/${S.results.length})`); b.addEventListener("click",renderMore); list.appendChild(b); }
}
$("#list").addEventListener("scroll",e=>{ const l=e.target; if(l.scrollTop+l.clientHeight>=l.scrollHeight-8 && S.shown<S.results.length) renderMore(); });

function initMap(){
  const map = new maplibregl.Map({
    container:"map", center:[127.8,36.1], zoom:6.1, minZoom:5.5, maxZoom:13, attributionControl:{compact:true},
    style:{ version:8, sources:{ dark:{ type:"raster", tiles:["https://a.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png","https://b.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png"], tileSize:256, attribution:"© OpenStreetMap contributors © CARTO" } },
      layers:[ {id:"bg",type:"background",paint:{"background-color":"#050813"}}, {id:"dark",type:"raster",source:"dark",paint:{"raster-brightness-max":0.55,"raster-saturation":-0.6}} ] }
  });

  map.on("load",()=>{
    map.addSource("pts",{type:"geojson",data:geo()});
    map.addLayer({id:"halo",type:"circle",source:"pts",paint:{"circle-color":"#ffd27a","circle-blur":1,"circle-opacity":["case",["==",["get","sel"],1],0.75,["==",["get","hit"],1],0.45,0.12],"circle-radius":["interpolate",["linear"],["zoom"],5,14,9,30,12,50]}});
    map.addLayer({id:"mid",type:"circle",source:"pts",paint:{"circle-color":"#ffe6b0","circle-blur":0.6,"circle-opacity":["case",["==",["get","sel"],1],0.9,["==",["get","hit"],1],0.6,0.18],"circle-radius":["interpolate",["linear"],["zoom"],5,6,9,12,12,20]}});
    map.addLayer({id:"core",type:"circle",source:"pts",paint:{"circle-color":"#fff8e6","circle-opacity":["case",["==",["get","sel"],1],1,["==",["get","hit"],1],0.9,0.3],"circle-radius":["interpolate",["linear"],["zoom"],5,2,9,4,12,6],"circle-stroke-color":"#4f8cff","circle-stroke-width":["case",["==",["get","sel"],1],2,0]}});
    map.on("click","core",e=>{ const id=e.features[0].properties.id; const n=NOTICES.find(x=>x.id===id); if(n) selectNotice(n); });

function geo(){ const hits=new Set(S.results.map(x=>x.n.id)); return {type:"FeatureCollection",features:NOTICES.map(n=>({type:"Feature",properties:{id:n.id,hit:hits.has(n.id)?1:0,sel:S.selected&&S.selected.id===n.id?1:0},geometry:{type:"Point",coordinates:[n.lon+jitter(n.id),n.lat+jitter(n.id*7)]}}))}; }
function jitter(k){ return ((k*9301+49297)%233280/233280-0.5)*0.05; }  // 같은 소재지가 겹치지 않도록 아주 작은 고정 흔들림
function updateMapHits(){ const s=S.map&&S.map.getSource("pts"); if(s) s.setData(geo()); }

// ================= 선택 공고 질문 → 테스트 응답 =================
// 모델 미연결: 답변은 시연용 테스트 응답이며, 의심 구절 표시도 '시연용'임을 배지로 고정한다.
function askNotice(text){
  addMsg("user", text); const n=S.selected;
  let answer, spans=[], det=["det-none","탐지 미실시","이 시안에는 탐지 모델이 연결되어 있지 않습니다"];
  if(/마감|일정|언제/.test(text)){
    answer = `공고문 기준 일정은 다음과 같습니다.\n${n.schedule}\n개찰은 제안서 평가 후 진행되며, 정확한 시각은 나라장터 공고 원문을 확인해야 합니다.`;
    // 시연용 의심 구절: 원문에 없는 문장(개찰 관련)을 표시. 오프셋은 Unicode 코드포인트 기준.
    const start = cpIndexOf(answer, "개찰은"); const endStr="진행되며,"; const end = cpIndexOf(answer,endStr)+cpLen(endStr);
    spans=[{start, end, reason:"이 문장은 선택 공고의 근거 자료(일정 항목)에서 확인되지 않는 내용입니다. 오류로 확정된 것이 아니라 확인이 필요한 정보입니다.", evidence:n.schedule, evidenceLabel:"일정 요약(시트 기준)"}];
    det=["det-partial","부분 검사 · 시연 데이터","실제 탐지 결과가 아니라 화면 흐름 확인용으로 넣은 표시입니다"];
  } else if(/자격|참가/.test(text)){
    answer = `이 공고의 참가 자격은 공고문과 제안요청서의 '입찰참가자격' 항목에 정의되어 있습니다. 이 시안에서는 해당 항목의 원문이 연결되어 있지 않아 요약을 제공하지 않습니다.\n\n지역제한(시트 기준): ${n.regionLimit}`;
  } else if(/예산|계약|금액/.test(text)){
    answer = `예산(공고정보): ${n.budget.toLocaleString()}원 (${won(n.budget)})\n발주기관: ${n.agency}\n계약 방식과 배점은 공고 원문·제안요청서에서 확인해야 하며, 이 시안에서는 연결되어 있지 않습니다.`;
  } else {
    answer = `'${text}'에 대한 답변은 모델이 연결된 뒤 생성됩니다. 이 시안에서는 공고의 기본 정보만 표시합니다.\n공고명: ${n.title}\n기관: ${n.agency}\n예산: ${won(n.budget)}`;
  }
  addMsg("bot", answer, { spans, meta:[["src-test","테스트 응답 · 모델 미연결","저장 예시 재생 / 테스트 응답 / 실제 생성 중 어느 것인지 항상 표시합니다"], det],
    foot: spans.length ? "점선 밑줄 구절을 누르면 의심 이유와 근거를 볼 수 있습니다. '확인 필요'는 오류 확정이 아닙니다." : "검출 0건이나 탐지 미실시는 답변이 정확하다는 보증이 아닙니다." });
}
// Unicode 코드포인트 기준 offset 유틸 (원문 문자열은 그대로 보존)
function cpLen(s){ return Array.from(s).length; }
function cpIndexOf(s, sub){ const i=s.indexOf(sub); return i<0? -1 : cpLen(s.slice(0,i)); }
function cpSlice(s, a, b){ return Array.from(s).slice(a,b).join(""); }
function renderAnswer(container, text, spans){
  const body=el("div"); let cur=0; const sorted=[...spans].sort((a,b)=>a.start-b.start);
  sorted.forEach(sp=>{
    if(sp.start>cur) body.appendChild(document.createTextNode(cpSlice(text,cur,sp.start)));
    const m=el("span","sus",cpSlice(text,sp.start,sp.end)); const t=el("span","tag","확인 필요"); m.appendChild(t);
    m.title="확인이 필요한 구절 (클릭하면 근거 보기)"; m.addEventListener("click",()=>openEvidence(text,sp)); body.appendChild(m); cur=sp.end;
  });
  body.appendChild(document.createTextNode(cpSlice(text,cur,cpLen(text))));
  container.appendChild(body);
}
function openEvidence(text, sp){
  const e=$("#evidence"); e.textContent=""; e.classList.remove("hidden");
  const h=el("h3",null,"확인이 필요한 구절"); const x=el("button",null,"닫기"); x.addEventListener("click",closeEvidence); h.appendChild(x); e.appendChild(h);
  const s1=el("div","sec"); s1.appendChild(el("h4",null,`답변 구절 (코드포인트 offset ${sp.start}–${sp.end})`)); const q1=el("div","q"); q1.appendChild(el("mark",null,cpSlice(text,sp.start,sp.end))); s1.appendChild(q1); e.appendChild(s1);
  const s2=el("div","sec"); s2.appendChild(el("h4",null,"의심 이유 (시연 데이터)")); s2.appendChild(el("div","q",sp.reason)); e.appendChild(s2);
  const s3=el("div","sec"); s3.appendChild(el("h4",null,"연결 근거 원문 — "+sp.evidenceLabel)); s3.appendChild(el("div","q",sp.evidence)); e.appendChild(s3);
  e.appendChild(el("div","note","이 표시는 탐지 모델 결과가 아니라 화면 흐름 확인용입니다. 과거 검수자 의견과 신규 탐지 결과는 실연결 시 서로 다른 라벨로 구분합니다."));
}
function closeEvidence(){ $("#evidence").classList.add("hidden"); }

// ================= 입력 =================
function submit(){ const t=$("#q").value.trim(); if(!t) return; $("#q").value=""; if(S.selected) askNotice(t); else askBrowse(t); }
$("#send").addEventListener("click",submit); $("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
</script>
